<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Menú digital con código QR para cafeterías y bares. Multilingüe: español, inglés y francés.">
  <meta name="theme-color" content="#3b2a20">
  <title>Menú · Café del Puente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="draft-bar" class="draft-bar" hidden>
    <span id="draft-text"></span>
    <button id="draft-reset" type="button"></button>
  </div>

  <header class="hero">
    <div class="lang" role="group" aria-label="Idioma / Language / Langue">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
    </div>
    <h1 id="cafe-name">Café del Puente</h1>
    <p id="cafe-tagline" class="tagline"></p>
    <p id="cafe-hours" class="hours"></p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Categorías"></nav>

  <div class="tools">
    <input type="search" id="search" autocomplete="off">
    <label class="toggle">
      <input type="checkbox" id="vegan-only">
      <span id="vegan-label"></span>
    </label>
  </div>

  <main id="menu" aria-live="polite"></main>

  <footer class="footer">
    <p id="allergen-note"></p>
    <a id="whatsapp" class="whatsapp" target="_blank" rel="noopener"></a>
    <p class="credit">Demo · <a href="servicio.html">¿Quieres este menú para tu negocio?</a> · <a href="admin.html">Panel</a></p>
  </footer>

  <button id="ask-open" class="ask-open" type="button"></button>

  <section id="ask-panel" class="ask-panel" hidden aria-labelledby="ask-title">
    <header class="ask-head">
      <strong id="ask-title"></strong>
      <button id="ask-close" class="ask-close" type="button">✕</button>
    </header>
    <div id="ask-log" class="ask-log" aria-live="polite"></div>
    <form id="ask-form" class="ask-form">
      <input id="ask-input" type="text" autocomplete="off" maxlength="200">
      <button id="ask-send" type="submit"></button>
    </form>
  </section>

  <script src="menu-data.js"></script>
  <script src="assistant.js"></script>
  <script src="app.js"></script>
</body>
</html>
